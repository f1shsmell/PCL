name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Tag，例如 v2.99.0.0'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and Publish
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Update Help
      run: |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}

    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")', 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"

    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release

    - name: Prepare release files
      id: package
      shell: pwsh
      run: |
        $tag = $env:RELEASE_TAG
        if ([string]::IsNullOrWhiteSpace($tag)) { throw '缺少发布 Tag。' }
        $version = ($tag -replace '^[vV]', '') -replace '[^0-9A-Za-z._-]', '-'
        if ([string]::IsNullOrWhiteSpace($version)) { throw "无效的 Tag：$tag" }

        $exe = Get-ChildItem -Path "Plain Craft Launcher 2\obj\Release" -Filter '*.exe' -File | Select-Object -First 1
        if ($null -eq $exe) { throw '未找到 Release 构建产物 exe。' }

        New-Item -ItemType Directory -Path dist -Force | Out-Null
        Copy-Item $exe.FullName "dist\PCL2-$version.exe" -Force
        Compress-Archive -Path "dist\PCL2-$version.exe" -DestinationPath "dist\PCL2-$version.zip" -Force

        @"
        本分支已取消上游 2.99.0.0 起对 MC 下载功能的限制。

        - 恢复原版游戏下载
        - 恢复整合包安装与版本修改中的 MC 本体选项
        "@ | Out-File -FilePath release-notes.md -Encoding utf8

        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Create or update GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_VERSION: ${{ steps.package.outputs.version }}
      run: |
        $tag = $env:RELEASE_TAG
        $version = $env:RELEASE_VERSION

        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release $tag 已存在，更新说明并覆盖产物。"
          gh release edit $tag --title "PCL $version" --notes-file release-notes.md
          gh release upload $tag "dist\PCL2-$version.exe" "dist\PCL2-$version.zip" --clobber
        } else {
          $releaseArgs = @(
            $tag,
            "dist\PCL2-$version.exe",
            "dist\PCL2-$version.zip",
            '--title', "PCL $version",
            '--notes-file', 'release-notes.md'
          )
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $releaseArgs += @('--target', $env:GITHUB_SHA)
          }
          gh release create @releaseArgs
        }
